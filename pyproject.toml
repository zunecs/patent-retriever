[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patent-retriever"
version = "0.1.0"
description = "Retrieves patent documents and renders them into the Patent Translation input format."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.1",
    "flask>=3.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
patent-retriever = "patent_retriever.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_retriever"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]